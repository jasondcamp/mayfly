[project]
name = "mayfly-cli"
version = "0.2.0"
description = "Short lived ephemeral environments on Kubernetes: one YAML spec, an isolated namespace with emulated AWS/Azure + real service pods, TTL teardown"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ephemeral-environments", "kubernetes", "preview-environments", "aws-emulator", "azure-emulator", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "kubernetes>=29.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Azure service classes (keyvault/servicebus provisioning): mayfly[azure]
azure = [
    "azure-keyvault-secrets>=4.8",
    "azure-servicebus>=7.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # keep in sync with the [azure] extra so tests exercise the real SDKs.
    # azure-servicebus: pre-release pin matching dragonfly/Dockerfile (pyAMQP
    # trailing-field fix; the CLI's management-plane calls work on 7.14.x
    # too, so the [azure] extra stays unpinned). Bump to 7.15.0 on release.
    "azure-keyvault-secrets>=4.8",
    "azure-servicebus==7.15.0b2",
    # dragonfly's pure-python SQL Server driver (see dragonfly/Dockerfile)
    "python-tds>=1.15",
]

[project.urls]
Homepage = "https://mayfly.sh"
Documentation = "https://docs.mayfly.sh"
Repository = "https://github.com/jasondcamp/mayfly"
Issues = "https://github.com/jasondcamp/mayfly/issues"

[project.scripts]
mayfly = "mayfly.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mayfly"]

[tool.hatch.build.targets.sdist]
# the repo also holds the docs site (node_modules!), brand assets, and
# container build contexts — none of which belong in the Python sdist
only-include = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Explicit selection so lint doesn't drift when ruff's defaults change.
select = ["E4", "E7", "E9", "F", "UP", "B", "C4", "PERF"]
ignore = [
  "B008",    # typer's declarative Option/Argument call-in-default pattern
  "PERF203", # try/except in loop: retry/skip loops are the point here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
